name: Android Release

on:
  push:
    branches:
      - mobile/android-capacitor
    paths:
      - "src/**"
      - "scripts/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false @capacitor/core@8.6.0 @capacitor/cli@8.6.0 @capacitor/android@8.6.0

      - name: Verify application
        run: npm run verify

      - name: Read app version
        id: app
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Generate web icons
        run: node scripts/generate-android-icons.cjs --web-only

      - name: Build web application
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Configure native APK updater
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ steps.app.outputs.version }}
        run: node scripts/configure-android-native.cjs

      - name: Generate launcher icons
        run: node scripts/generate-android-icons.cjs --android-only

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Check signing configuration
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing is not configured. No installable OTA release will be published yet."
            exit 0
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/ethical-world-release.jks"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ steps.app.outputs.version }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ethical-world-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Prepare update manifest
        if: steps.signing.outputs.configured == 'true'
        id: manifest
        env:
          VERSION: ${{ steps.app.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          TAG="android-v${VERSION}-${RUN_NUMBER}"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$APK")"
          URL="https://github.com/${REPOSITORY}/releases/download/\${TAG}/ethical-world.apk"
          jq -n \
            --arg version "$VERSION" \
            --argjson versionCode "$VERSION_CODE" \
            --arg apkUrl "$URL" \
            --arg sha256 "$SHA" \
            --argjson sizeBytes "$SIZE" \
            --argjson releaseNotes '["Vylepšené mobilní ovládání a spodní navigace.","Nová ikona Ethical World.","Kontrola a instalace aktualizací přímo v aplikaci."]' \
            '{version:$version,versionCode:$versionCode,apkUrl:$apkUrl,sha256:$sha256,sizeBytes:$sizeBytes,releaseNotes:$releaseNotes}' \
            > latest.json
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Publish signed Android release
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          VERSION: ${{ steps.app.outputs.version }}
        run: |
          gh release create "$TAG" \
            android/app/build/outputs/apk/release/app-release.apk#ethical-world.apk \
            latest.json#latest.json \
            --title "Ethical World ${VERSION}" \
            --notes "Podepsaná Android aktualizace. Aplikace ověřuje SHA-256 a instalaci předává systémovému instalátoru Android."

      - name: Report missing release signing key
        if: steps.signing.outputs.configured != 'true'
        run: |
          echo "Android OTA updater je součástí aplikace, ale publikování podepsaných aktualizací čeká na jednorázové nastavení Android signing secrets."
